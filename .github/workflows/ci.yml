name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Mantenha sincronizado com "coverage.thresholds" em vitest.config.mts
  MIN_COVERAGE: 95

jobs:
  quality:
    name: Typecheck & Build
    runs-on: ubuntu-latest
    services:
      oracle-xe:
        image: gvenzl/oracle-xe:slim
        env:
          ORACLE_PASSWORD: oraclepassword
          APP_USER: transaction_app
          APP_USER_PASSWORD: transactionpassword
        ports:
          - 1521:1521
        options: >-
          --health-cmd="healthcheck.sh"
          --health-interval=15s
          --health-timeout=10s
          --health-retries=10
      mongodb:
        image: mongo:latest
        env:
          MONGO_INITDB_ROOT_USERNAME: admin
          MONGO_INITDB_ROOT_PASSWORD: adminpassword
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      rabbitmq:
        image: rabbitmq:3-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: admin
          RABBITMQ_DEFAULT_PASS: adminpassword
        ports:
          - 5672:5672
        options: >-
          --health-cmd="rabbitmq-diagnostics -q ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check (src + tests)
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Dev script smoke test
        env:
          ORACLE_USER: transaction_app
          ORACLE_PASSWORD: transactionpassword
          ORACLE_CONNECT_STRING: localhost:1521/XEPDB1
          MONGO_URI: mongodb://admin:adminpassword@localhost:27017/transaction_logs?authSource=admin
          RABBITMQ_URL: amqp://admin:adminpassword@localhost:5672
          RABBITMQ_QUEUE_TRANSACTIONS: transactions.queue
        run: |
          npm run dev &
          DEV_PID=$!
          for i in $(seq 1 15); do
            if curl -sf http://localhost:3000/health > /dev/null; then
              echo "Dev server (ts-node-dev) responded successfully."
              kill "$DEV_PID"
              exit 0
            fi
            sleep 1
          done
          echo "Dev server did not respond within 15s."
          kill "$DEV_PID" 2>/dev/null || true
          exit 1

  test:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Publish coverage summary
        if: ${{ !cancelled() }}
        run: |
          node .github/scripts/coverage-summary.mjs \
            --summary "$GITHUB_STEP_SUMMARY" \
            --min-coverage "$MIN_COVERAGE" \
            --out "$RUNNER_TEMP/coverage-comment.md"

      - name: Comment coverage on PR
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const commentPath = path.join(process.env.RUNNER_TEMP, 'coverage-comment.md');
            if (!fs.existsSync(commentPath)) {
              return;
            }

            const body = fs.readFileSync(commentPath, 'utf8');
            const marker = '<!-- vitest-coverage-report -->';
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
            });

            const existing = comments.find((comment) => comment.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  docker-compose-lint:
    name: Validate docker-compose
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate docker-compose config
        run: docker compose -f docker-compose.yml config --quiet

  ci-status:
    name: CI Status
    if: ${{ !cancelled() }}
    needs: [quality, test, docker-compose-lint]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs succeeded
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" || "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more required jobs failed."
            exit 1
          fi
          echo "All required checks passed."
